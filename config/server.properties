# Server Resource Pack Configuration
# Force players to download the Divine Merchant resource pack

# Resource pack URL (will be set by server admin)
resource-pack=divine-merchant-resourcepack-v2.zip

# Force resource pack download (true = required, false = optional)
require-resource-pack=true

# Resource pack prompt message
resource-pack-prompt=§6Divine Merchant Resource Pack v2 - Required for custom merchant textures!

# Resource pack SHA-1 hash (calculated from the zip file)
resource-pack-sha1=a66904cc7875a8e3ac89825f153fe0e9d490736a

# Other server settings
enable-command-block=true
gamemode=survival
difficulty=normal
max-players=20
online-mode=false
white-list=false
spawn-protection=16
view-distance=10
simulation-distance=10 