name: Deploy to Minecraft Server

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd ~/minecraft
          echo "=== Pre-deployment status ==="
          git status --porcelain
          echo "=== Stashing any local changes ==="
          git stash --include-untracked || echo "Nothing to stash"
          echo "=== Pulling latest changes ==="
          git pull origin master || {
            echo "Pull failed, trying to reset and pull again..."
            git fetch origin
            git reset --hard origin/master
          }
          echo "=== Post-deployment status ==="
          git log --oneline -3
          echo "Server updated successfully!"

    - name: Restart server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          chmod +x ~/minecraft/scripts/restart.sh
          ~/minecraft/scripts/restart.sh
